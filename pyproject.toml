[project]
name = "yolo26-inference-service"
version = "2.0.0"
description = "YOLO26 object detection over HTTP: TensorRT / ONNX Runtime / PyTorch backends, dynamic batching, GPU telemetry, and a reproducible benchmark suite."
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "ultralytics>=8.4.215",
    # Headless: the service never opens a window. opencv-python (which
    # ultralytics depends on) is overridden away below, so exactly one cv2
    # build is ever installed.
    "opencv-python-headless>=5.1.0",
    "numpy>=2.4",
    "fastapi>=0.163.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.34",
    "pydantic-settings>=2.16.0",
    "prometheus-client>=0.26.0",
    "nvidia-ml-py>=13.615",
]

[project.optional-dependencies]
# Pick exactly one: `uv sync --extra gpu` or `uv sync --extra cpu`.
cpu = [
    "torch>=2.15.0",
    "torchvision>=0.29.0",
    "onnxruntime>=1.32.0",
]
gpu = [
    "torch>=2.15.0",
    "torchvision>=0.29.0",
    "onnxruntime-gpu[cuda,cudnn]>=1.32.0",
    "tensorrt-cu13>=11.4.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    # Starlette's TestClient transport. httpx2 is pydantic's successor to
    # httpx; Starlette deprecated the original as its test transport.
    "httpx2>=2.16.0",
    "ruff>=0.17.0",
]
# Benchmark and report tooling. Not needed by the service.
bench = [
    "matplotlib>=3.11.0",
    "httpx2>=2.16.0",
    "pycocotools>=2.0.11",
]
# Model export. TensorRT 11 is strongly typed: it dropped the FP16/INT8 builder
# flags and the INT8 calibrator, so reduced precision is baked into the ONNX
# graph by NVIDIA ModelOpt before the engine is built. ModelOpt's own [onnx]
# extra pins onnxruntime-gpu 1.22 (CUDA 12) on Windows, which would drag the
# whole CUDA 13 stack backwards, so its ONNX dependencies are listed here
# instead and ONNX Runtime stays on the version declared above.
export = [
    "onnx>=1.23.2",
    "onnxslim>=0.1.99",
    "nvidia-modelopt>=0.48.0 ; sys_platform != 'darwin'",
    "onnx-graphsurgeon>=0.6.1",
    "polygraphy>=0.53.6",
    "onnxconverter-common>=1.16.0",
    "onnxscript>=0.7.2",
    "ml-dtypes>=0.5",
    "lief>=1.0.0",
    "cppimport>=26.4",
    "cupy-cuda13x>=14.2.0 ; sys_platform != 'darwin'",
]

[tool.uv]
default-groups = ["dev", "bench", "export"]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]
# ultralytics declares opencv-python; this drops it in favour of the headless
# build declared above. Two cv2 builds in one environment overwrite each other.
override-dependencies = ["opencv-python ; sys_platform == 'never'"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]
tensorrt-cu13-libs = { index = "nvidia" }
tensorrt-cu13-bindings = { index = "nvidia" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[[tool.uv.index]]
name = "nvidia"
url = "https://pypi.nvidia.com"
explicit = true

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "vision"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tools/report.py" = ["E501"]  # long prose strings in the generated report
